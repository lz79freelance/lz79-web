<!doctype html>
<html lang="gl" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LZ79 Ecosystem | Galia Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #07090e; color: #f3f4f6; }
        /* Ajuste para que el buscador de Google encaje en modo oscuro */
        .gsc-control-cse { background-color: transparent !important; border: none !important; }
        .gsc-input-box { background-color: #111827 !important; border: 1px solid #374151 !important; }
        input.gsc-input { color: white !important; }
    </style>
</head>

<body>

<header class="fixed top-0 w-full bg-darkBg/85 backdrop-blur-md border-b border-gray-800 z-50">
    <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
        <span class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-green-400 to-cyan-400">LZ79</span>
    </div>
</header>

<main class="pt-32 pb-24 px-6">
    <section id="galia-buscador" class="max-w-4xl mx-auto">
        <div class="text-center mb-10">
            <h2 class="text-4xl font-black text-white">GALIA GALICIA</h2>
            <p class="text-gray-400 mt-2">Buscador regional integrado</p>
        </div>

        <div class="bg-[#111827] border border-gray-800 rounded-3xl p-8 shadow-2xl">
            <!-- AQUÍ ESTÁ EL BUSCADOR DE GOOGLE -->
            <script async src="https://cse.google.com/cse.js?cx=004056370420582210413:fyrjwtwatn8"></script>
            <div class="gcse-searchbox"></div>
            <div class="gcse-searchresults"></div>
        </div>
    </section>
</main>

<footer class="text-center py-8 text-xs text-gray-600">
    &copy; 2026 LZ79. Ecosistema Galia.
</footer>

</body>
</html>
