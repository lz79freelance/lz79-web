<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LZ79 | Ecosistema Profesional</title>
    <style>
        /* Reset y Estilos Base */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #0f172a; 
            color: #f1f5f9; 
            line-height: 1.6; 
            padding: 40px 20px;
        }

        .container { max-width: 1000px; margin: 0 auto; }

        /* Header */
        header { text-align: center; margin-bottom: 50px; }
        header h1 { font-size: 2.5rem; color: #38bdf8; margin-bottom: 10px; }
        header p { color: #94a3b8; font-size: 1.1rem; }

        /* Layout Grid */
        .main-grid { display: grid; grid-template-columns: 1fr 380px; gap: 30px; }
        @media (max-width: 850px) { .main-grid { grid-template-columns: 1fr; } }

        /* Tarjetas */
        .card { 
            background: #1e293b; 
            padding: 25px; 
            border-radius: 12px; 
            border: 1px solid #334155; 
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }
        h2 { margin-bottom: 20px; color: #e2e8f0; border-bottom: 2px solid #334155; padding-bottom: 10px; }

        /* Galería */
        .app-gallery { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
        .screenshot { 
            background: #0f172a; 
            height: 150px; 
            border-radius: 8px; 
            border: 1px solid #475569;
            display: flex; align-items: center; justify-content: center;
            color: #64748b; font-size: 0.8rem; text-align: center;
        }

        /* Botones */
        .btn-group { display: flex; flex-direction: column; gap: 10px; }
        button { 
            padding: 12px; border-radius: 6px; border: none; font-weight: 600; cursor: pointer; transition: 0.3s; 
        }
        .btn-primary { background: #38bdf8; color: #0f172a; }
        .btn-primary:hover { background: #7dd3fc; }
        .btn-soon { background: #334155; color: #94a3b8; cursor: not-allowed; }

        /* Chat */
        #chat-box { height: 350px; overflow-y: auto; background: #0f172a; border-radius: 8px; padding: 15px; margin-bottom: 15px; border: 1px solid #334155; }
        .msg { margin-bottom: 10px; font-size: 0.95rem; }
        .msg b { color: #38bdf8; }
        .input-area { display: flex; gap: 10px; }
        input { 
            flex: 1; padding: 12px; border-radius: 6px; border: 1px solid #475569; 
            background: #1e293b; color: white;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>LZ79 Ecosistema</h1>
        <p>Soluciones inteligentes de gestión, contabilidad e inventario</p>
    </header>

    <div class="main-grid">
        <!-- Columna Izquierda: App Showcase -->
        <section class="card">
            <h2>Suite LZ79</h2>
            <div class="app-gallery">
                <div class="screenshot">CAPTURA LZ79 ESSENTIAL</div>
                <div class="screenshot">CAPTURA LZ79 PRO</div>
            </div>
            <div class="btn-group">
                <button class="btn-primary">Descargar Versión Essential</button>
                <button class="btn-soon">Próximamente: App Móvil (APK)</button>
                <button class="btn-soon">Próximamente: Integración Cloud</button>
            </div>
        </section>

        <!-- Columna Derecha: Chat Galia -->
        <section class="card">
            <h2>Galia AI</h2>
            <div id="chat-box">
                <div class="msg"><b>Galia:</b> Hola, ¿en qué puedo ayudarte hoy con tu gestión?</div>
            </div>
            <div class="input-area">
                <input type="text" id="userInput" placeholder="Escribe tu mensaje...">
                <button class="btn-primary" id="sendButton">></button>
            </div>
        </section>
    </div>
</div>

<script>
    const chatBox = document.getElementById('chat-box');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendButton');

    async function sendMsg() {
        const text = userInput.value.trim();
        if(!text) return;

        chatBox.innerHTML += `<div class="msg"><b>Tú:</b> ${text}</div>`;
        userInput.value = '';
        
        try {
            const res = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ messages: [{role: 'user', content: text}] })
            });
            const data = await res.json();
            chatBox.innerHTML += `<div class="msg"><b>Galia:</b> ${data.reply}</div>`;
        } catch(e) {
            chatBox.innerHTML += `<div class="msg" style="color:#f87171;"><b>Error:</b> No se pudo conectar con Galia.</div>`;
        }
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    sendBtn.onclick = sendMsg;
    userInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') sendMsg(); });
</script>

</body>
</html>
