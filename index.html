<!doctype html>
<html lang="gl" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LZ79 Ecosystem | Galia Bee Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Script oficial de Google -->
    <script async src="https://cse.google.com/cse.js?cx=03d0f2141a98347c5"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { darkBg: '#07090e', cardBg: '#111827', techGreen: '#00ff88', techCian: '#06B6D4' } } } };
    </script>
    <style>
        html { color-scheme: dark; }
        body { background-color: #07090e; color: #f3f4f6; font-family: sans-serif; }
        /* Ajuste oscuro para los resultados de Google */
        .gsc-control-cse { background: transparent !important; border: none !important; }
        .gsc-results .gsc-cursor-page { color: white !important; }
    </style>
</head>

<body class="bg-darkBg text-gray-100">

<!-- Buscador oculto que procesa la petición -->
<div class="gcse-searchresults-only" data-resultsUrl="modal-resultados-lista"></div>

<main id="inicio">
    <!-- SECCIÓN BUSCADOR -->
    <section id="galia-buscador" class="py-24">
        <div class="max-w-5xl mx-auto px-6">
            <h2 class="text-5xl font-black text-center mb-10 text-white">GALIA BEE</h2>
            <div class="bg-cardBg border border-techCian/25 rounded-3xl p-8">
                <div class="flex gap-3">
                    <input id="galia-search-input" type="text" placeholder="Buscar en la Red Galia..." 
                        class="w-full bg-[#030712] border border-gray-700 rounded-2xl px-6 py-4 text-white focus:border-techCian outline-none">
                    <button type="button" onclick="ejecutarBusqueda()" class="bg-gradient-to-r from-techGreen to-techCian text-darkBg font-black px-8 py-4 rounded-2xl hover:opacity-90">
                        Buscar
                    </button>
                </div>
            </div>
        </div>
    </section>
</main>

<!-- VENTANA EMERGENTE (MODAL) -->
<div id="modal-buscador-resultado" class="fixed inset-0 bg-black/90 backdrop-blur-md z-50 flex items-center justify-center hidden p-4">
    <div class="bg-cardBg border border-techCian/50 rounded-3xl p-8 max-w-2xl w-full shadow-2xl relative max-h-[85vh] flex flex-col">
        <button onclick="cerrarBuscador()" class="absolute top-5 right-5 text-gray-400 hover:text-white text-2xl font-bold">&times;</button>
        
        <h3 class="text-xl font-black text-techCian mb-6">Resultados de Galia Bee</h3>
        
        <!-- Aquí se inyectan los resultados de Google -->
        <div id="modal-resultados-lista" class="overflow-y-auto flex-1 text-gray-200">
            <div class="gcse-searchresults-only"></div>
        </div>
    </div>
</div>

<script>
    function ejecutarBusqueda() {
        const query = document.getElementById("galia-search-input").value;
        if (!query) return;

        // Abrir el modal
        document.getElementById("modal-buscador-resultado").classList.remove("hidden");

        // Ejecutar la búsqueda en el motor de Google
        const element = google.search.cse.element.getElement('searchresults-only');
        element.execute(query);
    }

    function cerrarBuscador() {
        document.getElementById("modal-buscador-resultado").classList.add("hidden");
    }
</script>

</body>
</html>
