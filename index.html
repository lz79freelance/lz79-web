<!doctype html>
<html lang="gl" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LZ79 Revenue Hub | Galia Bee</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg: '#07090e',
                        cardBg: '#111827',
                        techGreen: '#00ff88',
                        techCian: '#06B6D4'
                    }
                }
            }
        };
    </script>
    <style>
        html { color-scheme: dark; }
        body { background-color: #07090e; color: #f3f4f6; font-family: sans-serif; }
    </style>
</head>

<body class="bg-darkBg text-gray-100 min-h-screen flex flex-col justify-between">

<!-- CABECERA DEL ECOSISTEMA LZ79 -->
<header class="border-b border-gray-800 bg-[#0b1120]/50 backdrop-blur-md sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-techGreen to-techCian flex items-center justify-center font-black text-darkBg text-xl shadow-lg shadow-techCian/20">
                LZ
            </div>
            <div>
                <span class="font-black text-lg tracking-wider text-white">LZ79 <span class="text-techCian">REVENUE HUB</span></span>
                <span class="block text-[10px] text-gray-400 uppercase tracking-widest">Ecosystem Suite</span>
            </div>
        </div>
        <nav class="hidden md:flex items-center gap-6 text-sm font-medium text-gray-300">
            <a href="#" class="hover:text-techCian transition-colors">Panel</a>
            <a href="#" class="hover:text-techCian transition-colors">Facturación</a>
            <a href="#" class="hover:text-techCian transition-colors">Inventario</a>
            <a href="#" class="text-techCian font-bold">Galia Bee</a>
        </nav>
    </div>
</header>

<!-- CONTENIDO PRINCIPAL -->
<main class="flex-1 flex items-center justify-center p-6">
    <div class="w-full max-w-3xl text-center">
        <span class="px-4 py-1.5 rounded-full bg-techCian/10 border border-techCian/30 text-techCian text-xs font-bold uppercase tracking-widest inline-block mb-4">
            Motor de Inteligencia & Búsqueda
        </span>
        <h1 class="text-5xl md:text-6xl font-black mb-8 text-white tracking-widest">GALIA BEE</h1>
        
        <div class="bg-cardBg border border-techCian/25 rounded-3xl p-6 sm:p-8 shadow-2xl relative overflow-hidden">
            <div class="absolute -right-10 -bottom-10 w-40 h-40 bg-techCian/5 rounded-full blur-3xl pointer-events-none"></div>
            
            <div class="flex flex-col sm:flex-row gap-3 relative z-10">
                <input id="galia-input" type="text" placeholder="Escribe tu búsqueda en la Red Galia..." 
                    class="w-full bg-[#030712] border border-gray-700 rounded-2xl px-6 py-4 text-white text-lg focus:border-techCian outline-none transition-all shadow-inner">
                <button id="btn-buscar" type="button" 
                    class="bg-gradient-to-r from-techGreen to-techCian text-darkBg font-black px-8 py-4 rounded-2xl hover:opacity-90 transition-all cursor-pointer text-lg shadow-lg">
                    Buscar
                </button>
            </div>
        </div>
    </div>
</main>

<!-- PIE DE PÁGINA -->
<footer class="border-t border-gray-800 py-6 text-center text-xs text-gray-500">
    <p>&copy; 2026 LZ79 Ecosystem. Todos los derechos reservados.</p>
</footer>

<!-- VENTANA EMERGENTE (MODAL LZ79 PURA) -->
<div id="modal-emergente" class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center hidden p-4">
    <div class="bg-cardBg border border-techCian/40 rounded-3xl w-full max-w-xl p-8 shadow-2xl flex flex-col relative text-center">
        <button id="btn-cerrar" class="absolute top-5 right-5 text-gray-400 hover:text-white text-2xl font-bold cursor-pointer">&times;</button>
        
        <div class="w-12 h-12 rounded-2xl bg-techCian/10 border border-techCian/30 flex items-center justify-center mx-auto mb-4 text-techCian font-black text-xl">
            🐝
        </div>
        
        <h3 class="text-2xl font-black text-white mb-2">Galia Bee Hub</h3>
        <p id="modal-query-text" class="text-sm text-techCian font-mono mb-6"></p>
        
        <div class="bg-[#030712] border border-gray-800 rounded-2xl p-6 mb-6">
            <p class="text-xs text-gray-400 mb-4">Haz clic para consultar los resultados indexados en el motor oficial:</p>
            <a id="btn-enlace-google" href="#" target="_blank" 
               class="inline-block w-full bg-gradient-to-r from-techGreen to-techCian text-darkBg font-black px-6 py-3.5 rounded-xl hover:opacity-90 transition-all shadow-lg text-center">
                Consultar en Motor Oficial &rarr;
            </a>
        </div>
    </div>
</div>

<script>
    const input = document.getElementById("galia-input");
    const btnBuscar = document.getElementById("btn-buscar");
    const modal = document.getElementById("modal-emergente");
    const btnCerrar = document.getElementById("btn-cerrar");
    const modalQueryText = document.getElementById("modal-query-text");
    const btnEnlaceGoogle = document.getElementById("btn-enlace-google");

    function lanzarBusqueda() {
        const query = input.value.trim();
        if (!query) return;

        modalQueryText.innerText = `Término: "${query}"`;
        btnEnlaceGoogle.href = `https://www.google.com/cse?cx=03d0f2141a98347c5&q=${encodeURIComponent(query)}`;
        modal.classList.remove("hidden");
    }

    btnBuscar.addEventListener("click", lanzarBusqueda);
    input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") lanzarBusqueda();
    });

    btnCerrar.addEventListener("click", () => modal.classList.add("hidden"));
    modal.addEventListener("click", (e) => {
        if (e.target === modal) modal.classList.add("hidden");
    });
</script>

</body>
</html>
