<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LZ79 Freelance - Proyectos y Soluciones</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0d1117;
      color: #f3f4f6;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .projects-header {
      text-align: center;
      margin-bottom: 25px;
    }

    .header-logo {
      max-height: 50px;
      margin-bottom: 10px;
    }

    .projects-header h2 {
      font-size: 24px;
      font-weight: 600;
      color: #ffffff;
      margin: 0;
    }

    .lz79-carousel-container {
      position: relative;
      width: 100%;
      max-width: 900px;
      overflow: hidden;
      border-radius: 12px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
      background: #111827;
      border: 1px solid #374151;
    }

    .carousel-track {
      display: flex;
      transition: transform 0.5s ease-in-out;
    }

    .carousel-slide {
      min-width: 100%;
      box-sizing: border-box;
      text-align: center;
    }

    .carousel-slide img {
      width: 100%;
      height: auto;
      display: block;
      border-bottom: 3px solid #3b82f6;
    }

    .slide-caption {
      background: #1f2937;
      color: #ffffff;
      padding: 15px;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .carousel-btn {
      position: absolute;
      top: 42%;
      transform: translateY(-50%);
      background: rgba(17, 24, 39, 0.8);
      color: white;
      border: 1px solid #4b5563;
      padding: 12px 18px;
      cursor: pointer;
      font-size: 18px;
      border-radius: 50%;
      transition: background 0.3s, transform 0.2s;
    }

    .carousel-btn:hover {
      background: #3b82f6;
      border-color: #3b82f6;
      transform: translateY(-50%) scale(1.05);
    }

    .carousel-btn.prev { left: 15px; }
    .carousel-btn.next { right: 15px; }
  </style>
</head>
<body>

  <div class="projects-header">
    <img src="img/logo.png" alt="LZ79 Freelance Logo" class="header-logo">
    <h2>Soluciones de Software y Gestión Industrial</h2>
  </div>

  <div class="lz79-carousel-container">
    <div class="carousel-track" id="carouselTrack">
      <!-- Diapositiva 1 -->
      <div class="carousel-slide">
        <img src="img/slide1.png" alt="Cálculo de Costes Industriales">
        <div class="slide-caption">Cálculo de Costes Industriales y Márgenes</div>
      </div>
      <!-- Diapositiva 2 -->
      <div class="carousel-slide">
        <img src="img/slide2.png" alt="TPV Hostelería - Plano de Mesas">
        <div class="slide-caption">Sistema TPV Hostelería: Gestión de Mesas</div>
      </div>
      <!-- Diapositiva 3 -->
      <div class="carousel-slide">
        <img src="img/slide3.png" alt="Comandas a Barra y Cocina">
        <div class="slide-caption">Envío Instantáneo a Barra y Cocina</div>
      </div>
      <!-- Diapositiva 4 -->
      <div class="carousel-slide">
        <img src="img/slide4.png" alt="Gestión de Almacén SGA">
        <div class="slide-caption">Control de Almacén y Logística (SGA)</div>
      </div>
      <!-- Diapositiva 5 -->
      <div class="carousel-slide">
        <img src="img/slide5.png" alt="Dashboard IA y Stock">
        <div class="slide-caption">Predicción de Demanda y Alertas con IA</div>
      </div>
    </div>

    <!-- Botones de navegación -->
    <button class="carousel-btn prev" onclick="moveSlide(-1)">&#10094;</button>
    <button class="carousel-btn next" onclick="moveSlide(1)">&#10095;</button>
  </div>

  <script>
    let currentIndex = 0;

    function moveSlide(direction) {
      const track = document.getElementById('carouselTrack');
      const slides = document.querySelectorAll('.carousel-slide');
      const totalSlides = slides.length;

      currentIndex += direction;

      if (currentIndex >= totalSlides) {
        currentIndex = 0;
      } else if (currentIndex < 0) {
        currentIndex = totalSlides - 1;
      }

      const offset = -currentIndex * 100;
      track.style.transform = `translateX(${offset}%)`;
    }

    // Auto-play cada 5 segundos
    setInterval(() => {
      moveSlide(1);
    }, 5000);
  </script>

</body>
</html>
