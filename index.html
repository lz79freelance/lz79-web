<!doctype html>
<html lang="gl" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LZ79 Ecosystem | Galia Bee Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { darkBg: '#07090e', cardBg: '#111827', techGreen: '#00ff88', techCian: '#06B6D4' } } } };
    </script>
    <style>
        html { color-scheme: dark; }
        body { background-color: #07090e; color: #f3f4f6; font-family: sans-serif; }
    </style>
</head>

<body class="bg-darkBg text-gray-100 min-h-screen flex flex-col justify-between">

<main class="flex-1 flex items-center justify-center p-6">
    <div class="w-full max-w-3xl text-center">
        <h2 class="text-5xl font-black mb-10 text-white tracking-wider">GALIA BEE</h2>
        <div class="bg-cardBg border border-techCian/25 rounded-3xl p-8 shadow-2xl">
            <div class="flex flex-col sm:flex-row gap-3">
                <input id="galia-search-input" type="text" placeholder="Buscar en la Red Galia..." 
                    class="w-full bg-[#030712] border border-gray-700 rounded-2xl px-6 py-4 text-white focus:border-techCian outline-none transition-all">
                <button id="galia-search-btn" type="button" class="bg-gradient-to-r from-techGreen to-techCian text-darkBg font-black px-8 py-4 rounded-2xl hover:opacity-90 transition-all cursor-pointer">
                    Buscar
                </button>
            </div>
        </div>
    </div>
</main>

<!-- VENTANA EMERGENTE (MODAL) LZ79 -->
<div id="modal-buscador-resultado" class="fixed inset-0 bg-black/90 backdrop-blur-md z-50 flex items-center justify-center hidden p-4">
    <div class="bg-cardBg border border-techCian/50 rounded-3xl p-6 sm:p-8 max-w-2xl w-full shadow-2xl relative max-h-[85vh] flex flex-col">
        <button id="cerrar-modal" class="absolute top-5 right-5 text-gray-400 hover:text-white text-2xl font-bold cursor-pointer">&times;</button>
        
        <h3 class="text-xl font-black text-techCian mb-4">Resultados de Galia Bee</h3>
        <p id="modal-query-display" class="text-xs text-gray-400 mb-6"></p>
        
        <!-- Contenedor donde pintaremos los resultados con diseño oscuro -->
        <div id="modal-resultados-lista" class="overflow-y-auto flex-1 text-gray-200 space-y-4 pr-2">
            <p class="text-techCian animate-pulse">Buscando en la red...</p>
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const input = document.getElementById("galia-search-input");
        const btn = document.getElementById("galia-search-btn");
        const modal = document.getElementById("modal-buscador-resultado");
        const cerrarBtn = document.getElementById("cerrar-modal");
        const queryDisplay = document.getElementById("modal-query-display");
        const listaResultados = document.getElementById("modal-resultados-lista");

        async function realizarBusqueda() {
            const query = input.value.trim();
            if (!query) return;

            queryDisplay.innerText = `Resultados para: "${query}"`;
            listaResultados.innerHTML = `<p class="text-techCian animate-pulse">Consultando Red Galia...</p>`;
            modal.classList.remove("hidden");

            // Si prefieres usar la API oficial de Custom Search con clave, o simular la respuesta limpia:
            // Nota: El ID del buscador es 03d0f2141a98347c5
            try {
                // Hacemos la petición a Google CSE API (requiere API Key si se usa por REST, 
                // o podemos usar un endpoint directo). Como alternativa ultra rápida sin key expuesta, 
                // puedes usar el redireccionamiento limpio o tu propia pasarela.
                
                // Si quieres que usemos el buscador nativo sin que pete, mira esta alternativa de redirección elegante:
                listaResultados.innerHTML = `
                    <div class="p-4 bg-gray-900 border border-gray-800 rounded-2xl text-center">
                        <p class="text-sm text-gray-300 mb-4">Pulsa el botón para consultar el índice global de Galia Bee:</p>
                        <a href="https://www.google.com/search?q=site:lz79freelance.com+${encodeURIComponent(query)}" target="_blank" 
                           class="inline-block bg-techCian text-darkBg font-bold px-6 py-3 rounded-xl hover:opacity-90">
                            Ver resultados en Google
                        </a>
                    </div>
                `;
            } catch (error) {
                listaResultados.innerHTML = `<p class="text-red-400">Error al conectar con el índice.</p>`;
            }
        }

        btn.addEventListener("click", realizarBusqueda);
        input.addEventListener("keydown", (e) => { if (e.key === "Enter") realizarBusqueda(); });
        cerrarBtn.addEventListener("click", () => modal.classList.add("hidden"));
        modal.addEventListener("click", (e) => { if (e.target === modal) modal.classList.add("hidden"); });
    });
</script>

</body>
</html>
