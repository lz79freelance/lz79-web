<!-- SCRIPT DE LÓGICA DEL CHAT Y MULTIDIOMA -->
<script>
    // Textos del chat en los tres idiomas
    const chatTranslations = {
        es: {
            welcome: "¡Hola! Soy el asistente virtual de LZ79. ¿En qué puedo ayudarte hoy con tu desarrollo, app o automatización?",
            placeholder: "Escribe tu consulta...",
            send: "Enviar",
            response: "He registrado tu consulta. Para proyectos personalizados, facturación o soporte directo, puedes escribirnos en contacto@lz79freelance.com."
        },
        en: {
            welcome: "Hello! I am the LZ79 virtual assistant. How can I help you today with your development, app, or automation?",
            placeholder: "Type your query...",
            send: "Send",
            response: "Your query has been logged. For custom projects, billing, or direct support, you can email us at contacto@lz79freelance.com."
        },
        pt: {
            welcome: "Olá! Sou o assistente virtual da LZ79. Como posso ajudar você hoje com seu desenvolvimento, app ou automação?",
            placeholder: "Digite sua dúvida...",
            send: "Enviar",
            response: "Sua consulta foi registrada. Para projetos personalizados, faturamento ou suporte direto, você pode nos escrever em contacto@lz79freelance.com."
        }
    };

    let currentLanguage = 'es';

    function toggleChat() {
        const window = document.getElementById('chat-window');
        const iconOpen = document.getElementById('chat-icon-open');
        const iconClose = document.getElementById('chat-icon-close');
        
        window.classList.toggle('hidden');
        iconOpen.classList.toggle('hidden');
        iconClose.classList.toggle('hidden');
        
        if (!window.classList.contains('hidden')) {
            document.getElementById('chat-input').focus();
        }
    }

    function handleKeyPress(e) {
        if (e.key === 'Enter') {
            sendMessage();
        }
    }

    function sendMessage() {
        const input = document.getElementById('chat-input');
        const messages = document.getElementById('chat-messages');
        const text = input.value.trim();

        if (!text) return;

        // Mensaje del usuario
        const userMsg = document.createElement('div');
        userMsg.className = "bg-techBlue text-white p-3 rounded-xl rounded-tr-none max-w-[85%] self-end break-words";
        userMsg.innerText = text;
        messages.appendChild(userMsg);

        input.value = "";
        messages.scrollTop = messages.scrollHeight;

        // Respuesta automática del bot en el idioma activo
        setTimeout(() => {
            const botMsg = document.createElement('div');
            botMsg.className = "bg-gray-800/80 text-gray-200 p-3 rounded-xl rounded-tl-none max-w-[85%] self-start break-words";
            botMsg.innerText = chatTranslations[currentLanguage].response;
            messages.appendChild(botMsg);
            messages.scrollTop = messages.scrollHeight;
        }, 1000);
    }

    // Función unificada que actualiza la web y el chat
    function changeLang(lang) {
        currentLanguage = lang;
        const t = translations[lang];
        const ct = chatTranslations[lang];

        // Actualizar textos de la web original
        document.getElementById('nav-servicios').innerText = t.navServicios;
        document.getElementById('nav-taller').innerText = t.navTaller;
        document.getElementById('btn-contacto').innerText = t.btnContacto;

        document.getElementById('hero-title-1').innerText = t.heroTitle1;
        document.getElementById('hero-title-2').innerText = t.heroTitle2;
        document.getElementById('hero-desc').innerText = t.heroDesc;

        document.getElementById('hero-btn-start').innerText = t.heroBtnStart;
        document.getElementById('hero-btn-view').innerText = t.heroBtnView;

        document.getElementById('services-main-title').innerText = t.servicesMainTitle;
        document.getElementById('services-main-desc').innerText = t.servicesMainDesc;

        document.getElementById('s1-desc').innerText = t.s1Desc;
        document.getElementById('s1-p1').innerText = t.s1P1;
        document.getElementById('s1-p2').innerText = t.s1P2;
        document.getElementById('s1-p3').innerText = t.s1P3;
        document.getElementById('s1-p4').innerText = t.s1P4;

        document.getElementById('s2-desc').innerText = t.s2Desc;
        document.getElementById('s2-p1').innerText = t.s2P1;
        document.getElementById('s2-p2').innerText = t.s2P2;
        document.getElementById('s2-p3').innerText = t.s2P3;
        document.getElementById('s2-p4').innerText = t.s2P4;

        document.getElementById('s3-desc').innerText = t.s3Desc;
        document.getElementById('s3-p1').innerText = t.s3P1;
        document.getElementById('s3-p2').innerText = t.s3P2;
        document.getElementById('s3-p3').innerText = t.s3P3;
        document.getElementById('s3-p4').innerText = t.s3P4;

        document.getElementById('about-title').innerText = t.aboutTitle;
        document.getElementById('about-desc').innerText = t.aboutDesc;
        document.getElementById('about-location').innerText = t.aboutLocation;
        document.getElementById('about-scope').innerText = t.aboutScope;

        document.getElementById('footer-rights').innerText = t.footerRights;
        document.getElementById('footer-support').innerText = t.footerSupport;
        document.getElementById('footer-privacy').innerText = t.footerPrivacy;

        // Actualizar textos del chat flotante
        document.getElementById('chat-input').placeholder = ct.placeholder;
        
        // Si quieres actualizar el mensaje de bienvenida inicial del chat al cambiar idioma:
        const firstMessage = document.querySelector('#chat-messages > div');
        if (firstMessage) {
            firstMessage.innerText = ct.welcome;
        }

        // Estilos visuales de los botones de idioma de la cabecera
        ['es', 'en', 'pt'].forEach(l => {
            const btn = document.getElementById(`btn-${l}`);
            btn.classList.toggle('text-white', l === lang);
            btn.classList.toggle('text-gray-500', l !== lang);
            btn.classList.toggle('hover:text-white', l !== lang);
        });
    }
</script>
