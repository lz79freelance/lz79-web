<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LZ79 Freelance - Soluciones y Chat</title>
  <!-- Tailwind CSS para mantener tu diseño original -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Estilos específicos para hacer el carrusel pequeño y centrado */
    .lz79-small-carousel {
      position: relative;
      width: 100%;
      max-width: 600px; /* Tamaño de cuadro pequeño y manejable */
      margin: 40px auto;
      overflow: hidden;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      background: #111827;
      border: 1px solid #374151;
    }

    .carousel-track {
      display: flex;
      transition: transform 0.5s ease-in-out;
    }

    .carousel-slide {
      min-width: 100%;
      box-sizing: border-box;
      text-align: center;
    }

    .carousel-slide img {
      width: 100%;
      height: auto;
      display: block;
    }

    .carousel-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(17, 24, 39, 0.7);
      color: white;
      border: 1px solid #4b5563;
      padding: 10px 14px;
      cursor: pointer;
      font-size: 16px;
      border-radius: 50%;
      transition: background 0.3s;
    }

    .carousel-btn:hover {
      background: #3b82f6;
    }

    .carousel-btn.prev { left: 10px; }
    .carousel-btn.next { right: 10px; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between">

  <!-- Cabecera de la página -->
  <header class="p-6 text-center border-b border-slate-800">
    <h1 class="text-2xl font-bold tracking-wider text-blue-400">LZ79 FREELANCE</h1>
    <p class="text-sm text-slate-400 mt-1">Desarrollo de Software y Automatización</p>
  </header>

  <!-- Contenido Principal -->
  <main class="flex-grow container mx-auto px-4 py-8 flex flex-col items-center justify-center">
    
    <div class="text-center mb-6">
      <h2 class="text-xl font-semibold mb-2">Vista previa de soluciones</h2>
      <p class="text-sm text-slate-400">Navega por los módulos principales del sistema</p>
    </div>

    <!-- CUADRO PEQUEÑO DEL CARRUSEL -->
    <div class="lz79-small-carousel">
      <div class="carousel-track" id="carouselTrack">
        <div class="carousel-slide">
          <img src="img/slide1.png" alt="Cálculo de Costes">
        </div>
        <div class="carousel-slide">
          <img src="img/slide2.png" alt="TPV Hostelería">
        </div>
        <div class="carousel-slide">
          <img src="img/slide3.png" alt="Comandas a Cocina">
        </div>
        <div class="carousel-slide">
          <img src="img/slide4.png" alt="Gestión de Almacén SGA">
        </div>
        <div class="carousel-slide">
          <img src="img/slide5.png" alt="Dashboard IA">
        </div>
      </div>

      <!-- Botones de flechas -->
      <button class="carousel-btn prev" onclick="moveSlide(-1)">&#10094;</button>
      <button class="carousel-btn next" onclick="moveSlide(1)">&#10095;</button>
    </div>

  </main>

  <!-- Widget de Chat Integrado (Pie de página / sección inferior) -->
  <footer class="bg-slate-900 border-t border-slate-800 p-4">
    <div class="max-w-xl mx-auto flex items-center gap-2">
      <input type="text" placeholder="Escribe tu consulta o idea..." class="flex-grow bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-sm text-slate-100 focus:outline-none focus:border-blue-500">
      <button class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition">Enviar</button>
    </div>
  </footer>

  <!-- Script del carrusel pequeño -->
  <script>
    let currentIndex = 0;

    function moveSlide(direction) {
      const track = document.getElementById('carouselTrack');
      const slides = document.querySelectorAll('.carousel-slide');
      const totalSlides = slides.length;

      currentIndex += direction;

      if (currentIndex >= totalSlides) {
        currentIndex = 0;
      } else if (currentIndex < 0) {
        currentIndex = totalSlides - 1;
      }

      const offset = -currentIndex * 100;
      track.style.transform = `translateX(${offset}%)`;
    }

    // Auto-play cada 5 segundos
    setInterval(() => {
      moveSlide(1);
    }, 5000);
  </script>

</body>
</html>
